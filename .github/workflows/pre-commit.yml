name: pre-commit

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    env:
      GIT_LFS_SKIP_SMUDGE: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install pre-commit
        run: python -m pip install "pre-commit==4.0.1"

      - name: Run pre-commit on pushed changes
        if: github.event_name == 'push'
        shell: bash
        run: |
          BASE="${{ github.event.before }}"
          HEAD="${{ github.sha }}"

          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="$(git rev-list --max-parents=0 "$HEAD" | tail -n 1)"
          fi

          echo "pre_commit_base=$BASE"
          echo "pre_commit_head=$HEAD"

          pre-commit run             --from-ref "$BASE"             --to-ref "$HEAD"             --show-diff-on-failure

      - name: Run pre-commit on pull-request changes
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"

          echo "pre_commit_base=$BASE"
          echo "pre_commit_head=$HEAD"

          pre-commit run             --from-ref "$BASE"             --to-ref "$HEAD"             --show-diff-on-failure
